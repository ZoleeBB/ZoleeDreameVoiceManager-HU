name: Dreame HU - Windows Release

on:
  push:
    branches: [main]
    paths:
      - VERSION-HU
    tags:
      - 'v*-hu.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version, e.g. v1.4.0-hu.1'
        required: true
        default: 'v1.4.0-hu.1'
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish EXE
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout HU overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare verified source
        shell: pwsh
        run: ./scripts/prepare-source.ps1
      - name: Test and build EXE
        shell: pwsh
        working-directory: _upstream-src
        run: ./scripts/build-release.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.release_tag || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_NAME -ne 'main') {
              throw 'Manual releases must be started on the main branch.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $releaseTag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              $releaseTag = $env:MANUAL_TAG
          } else {
              $releaseTag = (Get-Content -LiteralPath VERSION-HU -Raw -Encoding UTF8).Trim()
          }
          if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-hu\.[0-9]+
          $existing = gh release view "$releaseTag" --repo "$env:GITHUB_REPOSITORY" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
              throw "Release already exists: $releaseTag"
          }
          gh release create "$releaseTag" `
              '_upstream-src/dist/DreameSprachpaket-HU.exe' `
              '_upstream-src/dist/SHA256SUMS.txt' `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title "Dreame Voice Manager HU $releaseTag" `
              --notes "Private Windows build based on upstream v1.4.0 (commit 852f3043) and the Hungarian overlay. Check SHA256SUMS.txt. This EXE is not digitally signed."
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
) {
              throw "Invalid release tag: $releaseTag"
          }
          Write-Host "Publishing version: $releaseTag"
          $existing = gh release view "$releaseTag" --repo "$env:GITHUB_REPOSITORY" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
              throw "Release already exists: $releaseTag"
          }
          gh release create "$releaseTag" `
              '_upstream-src/dist/DreameSprachpaket-HU.exe' `
              '_upstream-src/dist/SHA256SUMS.txt' `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title "Dreame Voice Manager HU $releaseTag" `
              --notes "Private Windows build based on upstream v1.4.0 (commit 852f3043) and the Hungarian overlay. Check SHA256SUMS.txt. This EXE is not digitally signed."
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
