name: Dreame HU - Windows Release

on:
  push:
    branches: [main]
    paths:
      - VERSION-HU
      - 'voicepacks/assets/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version, e.g. v1.5.0 (then v1.5.1)'
        required: true
        default: 'v1.5.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish EXE
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout HU overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate pre-recorded Hungarian audio assets
        shell: pwsh
        run: |
          python scripts/verify_release_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Pre-recorded Hungarian audio files missing or corrupted. Upload both archives to voicepacks/assets in the same commit.' }
      - name: Prepare verified source
        shell: pwsh
        run: ./scripts/prepare-source.ps1
      - name: Test and build EXE
        shell: pwsh
        working-directory: _upstream-src
        run: ./scripts/build-release.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.release_tag || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_NAME -ne 'main') {
              throw 'Manual releases must be started on the main branch.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $releaseTag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              $releaseTag = $env:MANUAL_TAG
          } else {
              $releaseTag = (Get-Content -LiteralPath VERSION-HU -Raw -Encoding UTF8).Trim()
          }
          if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "Invalid release tag: $releaseTag"
          }
          Write-Host "Publishing version: $releaseTag"
          # Bundled ZIP is reusable on other models. The complete X50
          # archive includes factory audio; keep this repository private.
          $packs = @(
              'voicepacks/assets/Zolee_Dreame_HU_Elison_589_OGG.zip',
              'voicepacks/assets/Zolee_Dreame_X50_HU_Elison_Ready.tar.gz',
              'voicepacks/assets/VOICEPACK_SHA256SUMS.txt'
          )
          gh release view "$releaseTag" --repo "$env:GITHUB_REPOSITORY" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
              # Asset upload commits on main also update the already published
              # version, without a new version tag or manual asset transfer.
              Write-Host "Release $releaseTag exists: refresh the voice packs."
              gh release upload "$releaseTag" @packs --clobber --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE -ne 0) { throw 'Update of existing release voice pack assets failed.' }
          } else {
              $assets = @(
                  '_upstream-src/dist/DreameSprachpaket-HU.exe',
                  '_upstream-src/dist/SHA256SUMS.txt'
              ) + $packs
              gh release create "$releaseTag" @assets `
                  --repo "$env:GITHUB_REPOSITORY" `
                  --target "$env:GITHUB_SHA" `
                  --title "Dreame Voice Manager HU $releaseTag" `
                  --notes "Hungarian Windows build and pre-recorded Elison voice archives. The 589-OGG ZIP requires no ElevenLabs key. The full X50 archive contains factory audio; keep private pending redistribution review. See voicepacks/README.md for installation and SHA256SUMS.txt / VOICEPACK_SHA256SUMS.txt for hashes."
              if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
) {
              throw "Invalid release tag: $releaseTag"
          }
          Write-Host "Publishing version: $releaseTag"
          # Bundled ZIP is reusable on other models. The complete X50
          # archive includes factory audio; keep this repository private.
          $packs = @(
              'voicepacks/assets/Zolee_Dreame_HU_Elison_589_OGG.zip',
              'voicepacks/assets/Zolee_Dreame_X50_HU_Elison_Ready.tar.gz',
              'voicepacks/assets/VOICEPACK_SHA256SUMS.txt'
          )
          gh release view "$releaseTag" --repo "$env:GITHUB_REPOSITORY" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
              # Asset upload commits on main also update the already published
              # version, without a new version tag or manual asset transfer.
              Write-Host "Release $releaseTag exists: refresh the voice packs."
              gh release upload "$releaseTag" @packs --clobber --repo "$env:GITHUB_REPOSITORY"
              if ($LASTEXITCODE -ne 0) { throw 'Update of existing release voice pack assets failed.' }
          } else {
              $assets = @(
                  '_upstream-src/dist/DreameSprachpaket-HU.exe',
                  '_upstream-src/dist/SHA256SUMS.txt'
              ) + $packs
              gh release create "$releaseTag" @assets `
                  --repo "$env:GITHUB_REPOSITORY" `
                  --target "$env:GITHUB_SHA" `
                  --title "Dreame Voice Manager HU $releaseTag" `
                  --notes "Hungarian Windows build and pre-recorded Elison voice archives. The 589-OGG ZIP requires no ElevenLabs key. The full X50 archive contains factory audio; keep private pending redistribution review. See voicepacks/README.md for installation and SHA256SUMS.txt / VOICEPACK_SHA256SUMS.txt for hashes."
              if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
