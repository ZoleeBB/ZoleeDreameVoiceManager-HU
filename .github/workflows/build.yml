name: Dreame HU - Windows Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and package EXE
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout HU overlay
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare pinned upstream and custom HU source
        shell: pwsh
        run: ./scripts/prepare-source.ps1
      - name: Run self-tests and build Windows EXE
        shell: pwsh
        working-directory: _upstream-src
        run: ./scripts/build-release.ps1
      - name: Publish 7-day build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DreameVoiceManager-HU
          path: |
            _upstream-src/dist/DreameSprachpaket-HU.exe
            _upstream-src/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
